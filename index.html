        :root{
          --bg:#141210;
          --bg2:#1c1916;
          --card:#211e1a;
          --gold:#d4af37;
          --gold2:#f2df9a;
          --cream:#f7f2e9;
          --muted:#b8aea1;
          --line:rgba(212,175,55,.16);
          --shadow:0 22px 60px rgba(0,0,0,.32);
        }
        *{box-sizing:border-box}
        html{scroll-behavior:smooth}
        .rofo-root{
          min-height:100vh;
          background:
            radial-gradient(circle at 50% -12%, rgba(212,175,55,.11), transparent 36%),
            radial-gradient(circle at 90% 10%, rgba(212,175,55,.06), transparent 22%),
            var(--bg);
          color:var(--cream);
          font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
          line-height:1.6;
          -webkit-font-smoothing:antialiased;
          overflow-x:hidden;
        }
        .rofo-root a{color:inherit;text-decoration:none}
        .serif{font-family:Georgia, "Times New Roman", Times, serif}
        .wrap{width:min(1120px, calc(100% - 36px));margin:0 auto}
        /* NAV */
        .nav{
          position:sticky;
          top:0;
          z-index:40;
          background:rgba(20,18,16,.82);
          backdrop-filter:blur(14px) saturate(1.2);
          -webkit-backdrop-filter:blur(14px) saturate(1.2);
          border-bottom:1px solid rgba(255,255,255,.06);
        }
        .nav-inner{
          height:68px;
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:20px;
        }
        .logo{
          font-weight:800;
          letter-spacing:.10em;
          font-size:13px;
          text-transform:uppercase;
          color:var(--gold);
          display:flex;
          align-items:center;
          gap:10px;
        }
        .logo-dot{
          width:26px;height:26px;border-radius:999px;
          background:radial-gradient(circle at 35% 35%, var(--gold2), var(--gold));
          box-shadow:0 0 0 1px rgba(212,175,55,.2), 0 4px 18px rgba(212,175,55,.25);
          display:grid;place-items:center;
          color:#15120e;font-size:12px;font-weight:900;
        }
        .navlinks{display:flex;gap:24px;font-size:13px;color:#d9d0c4;align-items:center}
        .navlinks a{position:relative;padding:4px 0;transition:color .2s}
        .navlinks a:hover{color:var(--gold2)}
        .navlinks a:after{
          content:"";position:absolute;left:0;bottom:-2px;width:0;height:1px;background:var(--gold);transition:width .22s;
        }
        .navlinks a:hover:after{width:100%}
        /* HERO */
        .hero{padding:96px 0 76px;text-align:center;position:relative}
        .eyebrow{
          display:inline-flex;align-items:center;gap:12px;
          color:var(--gold);font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:700
        }
        .eyebrow:before,.eyebrow:after{content:"";width:34px;height:1px;background:rgba(212,175,55,.45)}
        h1{
          font-size:clamp(44px,7vw,80px);
          line-height:.96;
          margin:24px auto 0;
          max-width:900px;
          letter-spacing:-.04em;
          font-weight:800;
        }
        .gold{
          background:linear-gradient(100deg,var(--gold),var(--gold2) 55%, var(--gold));
          -webkit-background-clip:text;background-clip:text;color:transparent;
          filter:drop-shadow(0 0 22px rgba(212,175,55,.15));
        }
        .hero p{max-width:670px;margin:26px auto 0;color:#c5bbb0;font-size:17px;line-height:1.7}
        .actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:32px}
        .btn{
          display:inline-flex;align-items:center;justify-content:center;gap:8px;
          padding:14px 22px;border-radius:12px;font-weight:700;font-size:14px;
          transition:transform .22s, box-shadow .22s, background .22s, border-color .22s;
          cursor:pointer;white-space:nowrap;
          will-change:transform;
        }
        .btn-gold{background:var(--gold);color:#15120e;border:1px solid var(--gold)}
        .btn-gold:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(212,175,55,.22)}
        .btn-outline{border:1px solid var(--line);background:rgba(212,175,55,.04);color:var(--gold2)}
        .btn-outline:hover{border-color:rgba(212,175,55,.45);background:rgba(212,175,55,.09);transform:translateY(-1px)}
        .fine{font-size:11px;color:#756d63;margin-top:16px;letter-spacing:.02em}
        /* Sections */
        section{padding:70px 0}
        .section-head{text-align:center;max-width:720px;margin:0 auto 38px}
        .kicker{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.22em;font-weight:800}
        .section-head h2{font-size:clamp(30px,4vw,46px);margin:10px 0 12px;line-height:1.08;letter-spacing:-.02em}
        .section-head p{color:var(--muted);margin:0;font-size:15.5px;line-height:1.6}
        /* Cards */
        .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
        .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
        .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
        .card{
          background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01)), var(--card);
          border:1px solid rgba(255,255,255,.065);
          border-radius:20px;padding:24px;
          box-shadow:var(--shadow);
          transition:transform .26s cubic-bezier(.2,.8,.2,1), border-color .26s, box-shadow .26s;
          display:flex;flex-direction:column;
          will-change:transform;
        }
        .card:hover{transform:translateY(-5px);border-color:rgba(212,175,55,.28);box-shadow:0 26px 70px rgba(0,0,0,.38)}
        .icon{
          width:44px;height:44px;border-radius:14px;
          display:grid;place-items:center;
          background:rgba(212,175,55,.10);
          border:1px solid rgba(212,175,55,.14);
          font-size:20px;
        }
        .card h3{font-family:Georgia,serif;font-size:22px;margin:18px 0 8px;line-height:1.15}
        .card p{font-size:14px;color:#aaa095;margin:0 0 20px;line-height:1.6;flex:1}
        .link{color:var(--gold2);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px;transition:gap .2s}
        .link:hover{gap:8px;text-decoration:underline;text-underline-offset:4px}
        .link small{font-size:.72em;opacity:.78;font-weight:600}
        /* Guide */
        .guide{
          background:linear-gradient(135deg,rgba(212,175,55,.085),rgba(255,255,255,.018));
          border:1px solid var(--line);
          border-radius:26px;padding:8px 30px;
          box-shadow:var(--shadow);
        }
        .guide-row{
          display:flex;align-items:center;justify-content:space-between;gap:20px;
          padding:20px 0;border-bottom:1px solid rgba(255,255,255,.06);
          transition:background .2s, padding .2s;
          border-radius:10px;
        }
        .guide-row:last-child{border-bottom:0}
        .guide-row:hover{background:rgba(212,175,55,.04);padding-left:12px;padding-right:12px;margin:0 -12px}
        .guide-row strong{display:block;font-family:Georgia,serif;font-size:19px;letter-spacing:-.01em}
        .guide-row span{display:block;color:#9d9489;font-size:13px;margin-top:4px;line-height:1.5}
        .pill{
          white-space:nowrap;border:1px solid var(--line);
          padding:9px 14px;border-radius:999px;color:var(--gold2);
          font-size:12px;font-weight:700;background:rgba(212,175,55,.06);
          transition:all .2s;
        }
        .guide-row:hover .pill{border-color:rgba(212,175,55,.38);background:rgba(212,175,55,.12);transform:translateX(2px)}
        /* Brands */
        .brands{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
        .brand{
          padding:16px 10px;text-align:center;
          border:1px solid rgba(255,255,255,.065);
          background:#1b1815;border-radius:14px;
          color:#d9d0c4;font-weight:700;font-size:13px;
          transition:transform .2s, border-color .2s, color .2s, background .2s;
        }
        .brand:hover{color:var(--gold);border-color:var(--line);transform:translateY(-3px);background:#221e1a}
        /* Designs */
        .designs{
          position:relative;overflow:hidden;
          background:linear-gradient(145deg,#241f19,#171513 62%);
          border:1px solid rgba(212,175,55,.20);
          border-radius:30px;padding:46px;
          box-shadow:var(--shadow);
        }
        .designs:after{
          content:"☕";position:absolute;right:-18px;bottom:-58px;
          font-size:230px;opacity:.035;transform:rotate(-12deg);pointer-events:none;
        }
        .designs-grid{display:grid;grid-template-columns:1.28fr .72fr;gap:30px;align-items:center}
        .design-label{
          display:inline-flex;padding:7px 12px;border-radius:999px;
          background:rgba(212,175,55,.10);border:1px solid rgba(212,175,55,.16);
          color:var(--gold2);font-size:11px;text-transform:uppercase;letter-spacing:.16em;font-weight:800
        }
        .designs h2{font-size:clamp(32px,4vw,50px);line-height:1.03;margin:18px 0 14px;letter-spacing:-.02em}
        .designs p{color:#b9afa4;max-width:620px;font-size:15px;line-height:1.7}
        .design-box{
          background:rgba(0,0,0,.22);
          border:1px solid rgba(255,255,255,.07);
          border-radius:22px;padding:26px;
          backdrop-filter:blur(6px);
        }
        .design-box .mini{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.16em;font-weight:800}
        .design-box h3{font-family:Georgia,serif;font-size:25px;margin:10px 0 8px;line-height:1.15}
        .design-box p{font-size:13.5px;margin-bottom:18px;line-height:1.6}
        .notice{
          margin-top:22px;padding:14px 16px;border-radius:12px;
          background:rgba(212,175,55,.05);border:1px solid rgba(212,175,55,.11);
          color:#9f958a;font-size:12px;line-height:1.6;
        }
        /* Footer */
        .footer{padding:52px 0 64px;border-top:1px solid rgba(212,175,55,.14);margin-top:30px;text-align:center;background:rgba(0,0,0,.12)}
        .footer p{max-width:740px;margin:0 auto;color:#777067;font-size:12px;line-height:1.7}
        .footer .copy{margin-top:18px;color:#8e8479;font-size:12px}
        .top{
          position:fixed;right:18px;bottom:18px;z-index:50;
          width:46px;height:46px;border-radius:50%;
          display:grid;place-items:center;
          background:var(--gold);color:#16120d;font-weight:900;
          box-shadow:0 12px 30px rgba(0,0,0,.35), 0 0 0 1px rgba(212,175,55,.2);
          transition:transform .22s, opacity .22s, visibility .22s;
          opacity:0;visibility:hidden;transform:translateY(8px);
        }
        .top.visible{opacity:1;visibility:visible;transform:translateY(0)}
        .top:hover{transform:translateY(-2px) scale(1.04)}
        /* Performance: content-visibility for below-the-fold */
        .perf-section{content-visibility:auto;contain-intrinsic-size:600px}
        @media(max-width:900px){
          .wrap{width:min(1120px, calc(100% - 28px))}
          .grid4{grid-template-columns:repeat(2,1fr)}
          .brands{grid-template-columns:repeat(3,1fr)}
          .designs-grid{grid-template-columns:1fr}
          .designs{padding:32px 24px}
          .navlinks{gap:16px;font-size:12.5px}
          .hero{padding:72px 0 56px}
        }
        @media(max-width:600px){
          .grid4,.grid3,.grid2{grid-template-columns:1fr}
          .brands{grid-template-columns:repeat(2,1fr)}
          .nav-inner{height:62px}
          .logo{font-size:12px}
          .navlinks{display:none}
          .guide{padding:8px 18px}
          .guide-row{flex-direction:column;align-items:flex-start;gap:12px}
          .hero p{font-size:16px}
          section{padding:54px 0}
